name: flits
channels:
  - conda-forge
  - defaults

# Runtime dependencies are declared once, in pyproject.toml — installed below via
# `pip install -e .[nested,perf]`. This file adds only what conda provides better
# (binary/astro packages, the interactive stack) and the galactic-model extras
# whose install is non-trivial (see pygedm note).

dependencies:
  - python=3.12

  # ===== Conda-provided binary / astro packages (not in pyproject) =====
  - healpy  # HEALPix for all-sky maps
  - regions  # Astronomical region handling

  # ===== Interactive Computing =====
  - ipython
  - jupyter
  - jupyterlab
  - notebook
  - ipykernel

  # ===== Dev tools =====
  - pytest>=7.0
  - pytest-cov
  - ruff

  # ===== Package Management =====
  - pip
  - setuptools>=65,<81  # <81: pygedm imports pkg_resources, removed in setuptools 81
  - wheel

  # ===== Pip: the package itself + extras (single source of truth: pyproject.toml) =====
  - pip:
    # matplotlib is pinned <3.11 in pyproject: scienceplots 2.2.1 uses
    # matplotlib.style.core, removed in mpl 3.11
    - -e .[nested,perf]

    # Galactic Models (the `galactic` extra, spelled out because pygedm needs a
    # manual build on macOS arm64)
    - mwprop>=0.1.0  # Milky Way electron density models (NE2001)
    # pygedm: NE2001/YMW16 Galactic DM+scattering for the FRB DM budget
    # (galaxies/foreground/sightline_budget.py). Optional; the module degrades to
    # DM_MW=NaN if absent. macOS arm64 has no wheel and the pip build needs
    # netlib libf2c: build libf2c.a from netlib.org/f2c/libf2c.zip (make -f
    # makefile.u), copy its f2c.h into the pygedm sdist ne21c/ dir, then
    # `LIBRARY_PATH=<libf2c_dir> pip install .`. Runtime also needs the
    # setuptools<81 pin above; the scipy>=1.14 integrate.simps removal is
    # shimmed in sightline_budget._load_pygedm.
    # Deliberately NOT listed as an active dep: with no macOS arm64 wheel the
    # build failure would fail `conda env create` for everyone (verified
    # 2026-07-05); install manually per the note when DM_MW is needed.
    # - pygedm>=3.3.0  # offline NE2001/YMW16/YT2020 (see build note above)
