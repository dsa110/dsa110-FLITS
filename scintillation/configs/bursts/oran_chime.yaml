burst_id: oran
input_data_path: ${FLITS_ROOT}/scintillation/data/oran_chime.npz
telescope: chime
analysis:
  rfi_masking:
    find_burst_thres: 8.0
    padding_factor: 0.0
    use_symmetric_noise_window: true
    rfi_downsample_factor: 16
    enable_time_domain_flagging: false
    time_threshold_sigma: 7.0
    freq_threshold_sigma: 5.0
    # U=128; dt=0.65536 ms. Broad burst; builder diagnostic uses a
    # FWHM-aware tolerance and finds aligned hi-band detections around bin 164.
    manual_burst_window:
    - 100
    - 250
    manual_noise_window:
    - 60
    - 95
  acf:
    first_fit_lag: 2
    num_subbands: 4
    max_lag_mhz: 5.0
    use_snr_subbanding: true
    enable_intra_pulse_analysis: false
    intra_pulse_time_bins: 8
  fitting:
    fit_lagrange_mhz: 1.0
    reference_frequency_mhz: 600.0
    force_model: null
    harmonic_mask:
      enable: true
      spacing_mhz: 0.390625
      halfwidth_mhz: 0.05
  grid_regularization:
    enable: true
  baseline_subtraction:
    enable: true
    poly_order: 1
  noise:
    disable: false
    disable_template: false
    template_n_draws: 25
  self_noise:
    disable: false
  stored_fits: {}
