# Phase-1 uniform battery config -- ONE config for every burst and adapter
# (uniform-methodology constraint: no per-burst or per-instrument tuning).
data_dir: ~/Data/Faber2026/dsa110/DSA_bursts
out_dir: results/dm_campaign/battery
# Downsampling matches the injection-validation geometry (256 ch, ~1k samples)
# so Phase-0 verdicts transfer to the battery runs.
max_channels: 256
max_time: 1024
# Physical search windows (82 ms CHIME cutout bounds the sweep; see plan).
windows:
  dsa: 5.0
  chime: 4.0
adapters:
  - arrival_regression
  - dmphase_variant_intree
  - dmpower_variant_intree
  - dm_phase_published
  - dm_power_published
workers: 3
