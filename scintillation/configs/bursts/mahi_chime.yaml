burst_id: mahi
input_data_path: ${FLITS_ROOT}/scintillation/data/mahi_chime.npz
telescope: chime
analysis:
  rfi_masking:
    find_burst_thres: 8.0
    padding_factor: 0.0
    use_symmetric_noise_window: true
    rfi_downsample_factor: 16
    enable_time_domain_flagging: false
    time_threshold_sigma: 7.0
    freq_threshold_sigma: 5.0
    # U=512; dt=2.62144 ms. Builder diagnostic: hi-band peak bin 29.
    # 700-725 MHz has an off-window LTE-band RFI suspect at bin 49.
    manual_burst_window:
    - 20
    - 45
    manual_noise_window:
    - 0
    - 18
  acf:
    first_fit_lag: 2
    num_subbands: 4
    max_lag_mhz: 5.0
    use_snr_subbanding: true
    enable_intra_pulse_analysis: false
    intra_pulse_time_bins: 8
  fitting:
    fit_lagrange_mhz: 1.0
    reference_frequency_mhz: 600.0
    force_model: null
    harmonic_mask:
      enable: true
      spacing_mhz: 0.390625
      halfwidth_mhz: 0.05
  grid_regularization:
    enable: true
  baseline_subtraction:
    enable: true
    poly_order: 1
  noise:
    disable: false
    disable_template: false
    template_n_draws: 25
  self_noise:
    disable: false
  stored_fits: {}
