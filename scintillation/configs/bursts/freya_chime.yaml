burst_id: freya
input_data_path: ${FLITS_ROOT}/scintillation/data/freya_chime.npz
telescope: chime
analysis:
  rfi_masking:
    find_burst_thres: 8.0
    padding_factor: 0.0
    use_symmetric_noise_window: true
    rfi_downsample_factor: 16
    enable_time_domain_flagging: false
    time_threshold_sigma: 7.0
    freq_threshold_sigma: 5.0
    # time bins (dt=0.32768 ms): local burst span >3 sigma around bin ~250 is 244-267.
    manual_burst_window:
    - 244
    - 268
    manual_noise_window:
    - 0
    - 180
  acf:
    # Full CHIME band is diagnostic only: the expected NE2025 MW floor is ~38.8 kHz at
    # 600 MHz and scales as nu^4.4 to ~138 kHz at 800 MHz, while the 400 MHz scale is
    # near one 6.1 kHz fine channel and is effectively unresolved.
    num_subbands: 4
    max_lag_mhz: 5.0
    use_snr_subbanding: true
    enable_intra_pulse_analysis: false
    intra_pulse_time_bins: 8
  fitting:
    # freya floor from analysis/scattering-refit-2026-06/scint_census: 1.6421 MHz at 1.405 GHz.
    fit_lagrange_mhz: 1.0
    reference_frequency_mhz: 600.0
    force_model: null
  grid_regularization:
    # No-op if this npz's grid is uniform; on a gapped grid the index-lag ACF
    # axis is stretched by mean/native spacing (issue #120, E1/E2 experiment).
    enable: true
  baseline_subtraction:
    enable: true
    poly_order: 1
  noise:
    disable: false
    disable_template: false
    template_n_draws: 25
  self_noise:
    disable: false
  stored_fits: {}
