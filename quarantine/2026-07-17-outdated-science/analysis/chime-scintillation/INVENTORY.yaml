    target: freya
    data_class: real_chime_product_with_synthetic_injections
    status: diagnostic_only
    machine_status: documented_fail
    qualified_measurement: false
    blinded: true
    unblinded_fit_produced: false
    common_mode_cancellation: pass  # G2 off-pulse null clean; the ratio cancels g(nu)
    summary: analysis/chime-scintillation/experiments/p2-routeb-voltage/RESULT.md
    validation: analysis/chime-scintillation/experiments/p2-routeb-voltage/validation.json
    decisive_failures:
      - g1_detectable_width_recovery_below_snr_ceiling  # both S1 and S2, all Dnu_d>=127 kHz cells
    notes:
      - G2 (off-pulse null) PASSES for S1 and S2 - the on/off ratio cancels the
        ~35 kHz common mode that every prior route retained; the failure is the
        radiometer S/N ceiling at f_b=0.05 (f_b*m signal ~ 0.0075-0.0085), not
        the common-mode confounder. Separates the two failure modes.
      - S3 (complex-voltage variant) implemented and unit-tested but not run -
        complex fine-channel voltages not staged on h17 (out of P2 scope).
  - id: p3-optimal-estimator
    target: freya
    data_class: real_chime_product_with_synthetic_injections
    status: unblinded_no_admissible_measurement
    machine_status: calibrated_then_unblinded
    qualified_measurement: false
    blinded: false  # owner-authorized one-shot unblinding 2026-07-15
    unblinded_fit_produced: true
    common_mode_cancellation: pass  # inherits P2's ratio construction unchanged
    summary: analysis/chime-scintillation/experiments/p3-optimal-estimator/RESULT.md
    frozen_config: analysis/chime-scintillation/experiments/p3-optimal-estimator/frozen_config.json
    notes:
      - First passing blinded gate calibration of the campaign (G1'' + G2'' both
        pass; T battery pass). Delay-domain matched estimator on the P2 ratio
        spectra per the owner-sanctioned P3' amendment (no block demeaning,
        k>=11 envelope cut, null-mean-subtracted z; z_trials = 2.06).
      - Gate 0b killed the originally frozen (block-demeaned) spec at 1.24 sigma
        forecast before anything was built; amendment restored 3.0-4.5 sigma.
      - One-shot unblinding (owner-authorized): z_max=40.4 pinned at the
        400 kHz scan edge with a_hat ~1e-3 (11x the calibrated scintillation
        ceiling; implied m~0.6) -> intrinsic spectral envelope, DECLINED as a
        Delta-nu_d measurement (fail-closed). Scintillation constraint is
        envelope-confusion-limited; interpretation wording awaits owner
        ratification.
  - id: p4-envelope-model
    target: freya
    data_class: real_chime_product_with_synthetic_injections_and_surrogates
    status: documented_fail_envelope_not_separable
    machine_status: e2_fail_branch
    qualified_measurement: false
    evidential_class: exploratory  # post-P3'-unblinding, owner-sanctioned 2026-07-15
    real_residual_scanned: false  # 0 of the 3 permitted looks spent
    summary: analysis/chime-scintillation/experiments/p4-envelope-model/RESULT.md
    frozen_config: analysis/chime-scintillation/experiments/p4-envelope-model/p4_frozen_config.json
    notes:
      - Envelope-model-and-subtract follow-up to P3' (record
        experiment-chime-scint-p4-envelope-model.md, frozen before any residual
        statistic). Three families (spline / GP / delay low-pass), templates
        rebuilt through the identical model+subtract chain per operating point.
      - Predeclared E2 fail branch triggered. Stiff scales leave 5.4-71.9
        max-z of envelope-model-mismatch false structure (surrogate control vs
        noise p95 ~2); the one control-clean scale (GP l=0.5 MHz) absorbs the
        injected scintles (width bias -0.45..-0.93, zero certified cells); only
        77 kHz cells (below the admissible window) certify anywhere, and only
        at control-failing scales. All three families dropped.
      - E3b unavailable (single profile component, S/N 11); E3c unavailable
        (no trusted DSA-band Delta-nu_d for freya - DSA fits revoked pending
        the trust reset).
      - Consequence - the intrinsic envelope is not separable in-house; the
        CHIME constraint stays envelope-confusion-limited with no quantifiable
        post-subtraction upper limit.
